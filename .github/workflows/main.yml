name: Daily Email Automation

on:
  schedule:
    # Runs every day at 8:00 AM UTC
    - cron: '0 11 * * *'
  
  # Allows you to manually trigger it from GitHub to test it instantly
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository files onto the cloud server
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install your required packages
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run your script while securely injecting your Resend and ExchangeRate API key
    - name: Run main.py
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
      run: |
        python main.py
